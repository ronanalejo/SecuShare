<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - SecuShare</title>
    <link rel="stylesheet" href="./css/StorePageCSS.css">
    <link rel="stylesheet" href="./css/addProduct.css">
    <link rel="stylesheet" href="./css/product.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <header>
        <a href="StorePage.html" class="logo"><img src="Img/Logo_Summer.png" alt="SecuShare Logo"></a>
        <ul class="navmenu" id="mainNav"></ul>
        <div class="navicon">
            <a href="Cart.html"><i class='bx bx-cart-alt'></i></a>
            <a href="profile.html"><i class='bx bxs-user-circle'></i></a>
            <div class="bx bx-menu" id="menu-icon"></div>
        </div>
    </header>
    <section class="profile-section">
        <div class="sidebar">
            <ul>
                <li><a href="profile.html" class="active"><i class='bx bx-home-alt'></i> Home</a></li>
                <li><a href="Products.html"><i class='bx bx-book-open'></i> Products</a></li>
                <li><a href="Sales"><i class='bx bx-dollar-circle'></i> Sales</a></li>
                <li><a href="cashOut.html"><i class='bx bx-wallet' ></i> CashOut</a></li>
                <li><a href="editProfile.html"><i class='bx bx-cog'></i> Settings</a></li>
            </ul>
        </div>
        <div class="main-content">
            <div class="profile-container">
                <h2>Create a New Product</h2>
                <form id="addProductForm" action="editProduct.html" method="POST">
                    <div class="form-group">
                        <label for="productName">Name</label>
                        <input type="text" id="productName" name="productName" required>
                    </div>
                    <div class="form-group">
                        <label for="productType">Product Type</label>
                        <select id="productType" name="productType" required>
                            <option value="image">Image</option>
                            <option value="video">Video</option>
                            <option value="audio">Audio</option>
                            <option value="pdf">PDF</option>
                            <option value="ebook">E-Book</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="price">Price (₱)</label>
                        <input type="number" id="price" name="price" min="0" step="0.01" required>
                    </div>
                    <div class="form-buttons">
                        <button type="submit">Next: Customize</button>
                        <a href="Products.html" class="cancel-btn">Cancel</a>
                    </div>
                </form>
                <p>Make some selections, fill in some boxes, and go live in minutes.</p>
                <p>Our Help Center has everything you need to know.</p>
            </div>
        </div>
    </section>

    <script type="module" src="./js/firebase.js"></script>
    <script type="module" src="./js/firestore.js"></script>
    <script type="module" src="./js/auth.js"></script>
    <script type="module" src="./js/addProduct.js"></script>
</body>
</html>
