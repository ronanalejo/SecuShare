<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Product</title>
    <link rel="stylesheet" href="css/addProduct.css">
</head>
<body>
    <header>
        <a href="StorePage.html" class="logo"><img src="Img/Logo_Summer.png" alt="SecuShare Logo"></a>
        <nav>
            <ul>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="editProfile.html">Edit Profile</a></li>
                <li><a href="StorePage.html">Store</a></li>
                <li><a href="Products.html">Products</a></li>
                <li><button id="logoutBtn" class="auth-btn">Logout</button></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <h1>Create a New Product</h1>
        <form action="editProduct.html" method="POST">
            <div class="form-group">
                <label for="productName">Name</label>
                <input type="text" id="productName" name="productName" required>
            </div>
            <div class="form-group">
                <label for="productType">Products</label>
                <select id="productType" name="productType" required>
                    <option value="digital">Digital product</option>
                    <option value="course">Course or tutorial</option>
                    <option value="ebook">E-book</option>
                    <option value="membership">Membership</option>
                    <option value="physical">Physical good</option>
                    <option value="bundle">Bundle</option>
                </select>
            </div>
            <div class="form-group">
                <label for="price">Price ($)</label>
                <input type="number" id="price" name="price" min="0" step="0.01" required>
            </div>
            <button type="submit">Next: Customize</button>
            <a href="editProduct.html">"dummy next"</a>
        </form>
        <p>Make some selections, fill in some boxes, and go live in minutes.</p>
        <p>Our Help Center has everything you need to know.</p>
    </div>
</body>
</html>
