<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - SecuShare</title>
    <link rel="stylesheet" href="./css/StorePageCSS.css">
    <link rel="stylesheet" href="./css/editProduct.css">
</head>
<body>
    <header>
        <a href="StorePage.html" class="logo"><img src="Img/Logo_Summer.png" alt="SecuShare Logo"></a>
        <ul class="navmenu" id="mainNav">
        </ul>
        <div class="navicon">
            <a href="Cart.html"><i class='bx bx-cart-alt'></i></a>
            <a href="profile.html"><i class='bx bxs-user-circle'></i></a>
            <div class="bx bx-menu" id="menu-icon"></div>
        </div>
    </header>
    <section class="profile-section">
        <div class="sidebar">
            <ul>
                <li><a href="profile.html"><i class='bx bx-home-alt'></i> Home</a></li>
                <li><a href="Products.html"><i class='bx bx-book-open'></i> Products</a></li>
                <li><a href="Sales.html"><i class='bx bx-dollar-circle'></i> Sales</a></li>
                <li><a href="cashOut.html"><i class='bx bx-wallet'></i> CashOut</a></li>
                <li><a href="editProfile.html"><i class='bx bx-cog'></i> Settings</a></li>
            </ul>
        </div>
        <main class="main-content">
            <div class="profile-container">
                <h2>Edit Product</h2>
                <form id="editProductForm">
                    <div class="form-group">
                        <label for="productName">Product Name</label>
                        <input type="text" id="productName" name="productName" required>
                    </div>
                    <div class="form-group">
                        <label for="productPrice">Price</label>
                        <input type="number" id="productPrice" name="productPrice" required>
                    </div>
                    <div class="form-group">
                        <label for="productDescription">Description</label>
                        <textarea id="productDescription" name="productDescription" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="productQty">Quantity</label>
                        <input type="number" id="productQty" name="productQty" required>
                    </div>
                    <div class="form-group" id="coverImageGroup">
                        <label for="coverImage">Cover Image</label>
                        <input type="file" id="coverImage" name="coverImage" accept="image/png, image/jpeg">
                    </div>
                    <div class="form-group" id="productTeasersGroup">
                        <label for="productTeasers">Product Teasers</label>
                        <input type="file" id="productTeaser1" name="productTeaser1" accept="image/png, image/jpeg">
                        <input type="file" id="productTeaser2" name="productTeaser2" accept="image/png, image/jpeg">
                        <input type="file" id="productTeaser3" name="productTeaser3" accept="image/png, image/jpeg">
                        <input type="file" id="productTeaser4" name="productTeaser4" accept="image/png, image/jpeg">
                        <input type="file" id="productTeaser5" name="productTeaser5" accept="image/png, image/jpeg">
                    </div>
                    <div class="form-group" id="productFileGroup">
                        <label for="productFile">Product File</label>
                        <input type="file" id="productFile" name="productFile" accept="image/png, image/jpeg">
                    </div>
                    <div class="form-group">
                        <label for="productType">Product Type</label>
                        <select id="productType" name="productType" required>
                            <option value="image">Image</option>
                            <option value="video">Video</option>
                            <option value="audio">Audio</option>
                            <option value="pdf">PDF</option>
                            <option value="ebook">eBook</option>
                        </select>
                    </div>
                    <div class="form-group" id="subCategoryGroup">
                        <label for="subCategory">Subcategory</label>
                        <select id="subCategory" name="subCategory" required>
                            <!-- Options will be populated by JavaScript -->
                        </select>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="save-btn">Save Changes</button>
                    </div>
                </form>
            </div>
        </main>
    </section>
    <script type="module" src="./js/firebase.js"></script>
    <script type="module" src="./js/firestore.js"></script>
    <script type="module" src="./js/auth.js"></script>
    <script type="module" src="./js/editProduct.js"></script>
</body>
</html>
