<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - SecuShare</title>
    <link rel="stylesheet" href="./css/StorePageCSS.css">
    <link rel="stylesheet" href="./css/EditProduct.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <header>
        <a href="profile.html" class="logo"><img src="Img/Logo_Summer.png" alt="SecuShare Logo"></a>
        <nav>
            <ul>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="StorePage.html">Store</a></li>
                <li><button id="logoutBtn" class="auth-btn">Logout</button></li>
            </ul>
        </nav>
    </header>
    <section class="product-section">
        <div class="sidebar">
            <ul>
                <li><a href="profile.html"><i class='bx bx-home-alt'></i> Home</a></li>
                <li><a href="Products.html"><i class='bx bx-book-open'></i> Products</a></li>
                <li><a href="Sales"><i class='bx bx-dollar-circle'></i> Sales</a></li>
                <li><a href="cashOut.html"><i class='bx bx-wallet' ></i> CashOut</a></li>
                <li><a href="editProfile.html"><i class='bx bx-cog'></i> Settings</a></li>
            </ul>
        </div>
        <div class="main-content">
            <div class="product-container">
                <h2>Edit Product</h2>
                <form id="editProductForm">
                    <div class="form-group">
                        <label for="productName">Product Name</label>
                        <input type="text" id="productName" name="productName" required>
                    </div>
                    <div class="form-group">
                        <label for="productType">Product Type</label>
                        <select id="productType" name="productType" required>
                            <option value="image">Image</option>
                            <option value="video">Video</option>
                            <option value="audio">Audio</option>
                            <option value="pdf">PDF</option>
                            <option value="ebook">E-Book</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="subCategory">Subcategory</label>
                        <select id="subCategory" name="subCategory" required>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="productDescription">Description</label>
                        <textarea id="productDescription" name="productDescription" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="productPrice">Price</label>
                        <input type="number" id="productPrice" name="productPrice" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="coverImage">Cover Image</label>
                        <input type="file" id="coverImage" name="coverImage" accept="image/png, image/jpeg">
                    </div>
                    <div class="form-group">
                        <label for="productPictures">Product Pictures</label>
                        <div class="thumbnails">
                            <input type="file" id="productPicture1" name="productPicture1" accept="image/png, image/jpeg">
                            <input type="file" id="productPicture2" name="productPicture2" accept="image/png, image/jpeg">
                            <input type="file" id="productPicture3" name="productPicture3" accept="image/png, image/jpeg">
                            <input type="file" id="productPicture4" name="productPicture4" accept="image/png, image/jpeg">
                            <input type="file" id="productPicture5" name="productPicture5" accept="image/png, image/jpeg">
                        </div>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="save-btn">Save Changes</button>
                    </div>
                    <div class="form-group">
                        <button type="button" id="cancelBtn" class="cancel-btn" onclick="window.location.href='Products.html';">Cancel</button>
                    </div>
                    
                                       
                </form>
            </div>
        </div>
    </section>
    <script type="module" src="./js/firebase.js"></script>
    <script type="module" src="./js/firestore.js"></script>
    <script type="module" src="./js/auth.js"></script>
    <script type="module" src="./js/editProduct.js"></script>
</body>
</html>
