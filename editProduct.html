<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - SecuShare</title>
    <link rel="stylesheet" href="./css/editProduct.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <header>
        <a href="StorePage.html" class="logo"><img src="Img/Logo_Summer.png" alt="SecuShare Logo"></a>
        <nav>
            <ul>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="editProfile.html">Edit Profile</a></li>
                <li><a href="StorePage.html">Store</a></li>
                <li><a href="Products.html">Products</a></li>
                <li><button id="logoutBtn" class="auth-btn">Logout</button></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <h2 class="section-title">Edit Product</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="productName">Product Name</label>
                <input type="text" id="productName" name="productName" required>
            </div>
            <div class="form-group">
                <label for="productPrice">Price</label>
                <input type="number" id="productPrice" name="productPrice" required>
            </div>
            <div class="form-group">
                <label for="productDescription">Description</label>
                <textarea id="productDescription" name="productDescription" rows="5"></textarea>
            </div>
            <div class="form-group">
                <label for="coverImage">Cover Image</label>
                <input type="file" id="coverImage" name="coverImage" accept="image/*">
            </div>
            <div class="form-group">
                <label for="thumbnailImage">Thumbnail Image</label>
                <input type="file" id="thumbnailImage" name="thumbnailImage" accept="image/*">
            </div>
            <div class="form-group">
                <label for="productQty">Quantity</label>
                <input type="number" id="productQty" name="productQty" required>
            </div>
            <button type="submit" class="btn-save-continue"><box-icon name='save'></box-icon> Save and Continue</button>
        </form>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
