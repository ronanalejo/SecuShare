<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <link rel="stylesheet" href="css/payment.css">
    <link rel="stylesheet" href="css/StorePageCSS.css">
</head>
<body>
    <header>
        <a href="StorePage.html" class="logo"><img src="Img/Logo_Summer.png" alt="SecuShare Logo"></a>
    </header>

    <main class="payment-status">
        <h1>Payment Successful!</h1>
        <p>Thank you for your purchase. Your payment was processed successfully.</p>
        <p>Order ID: <span id="order-id"></span></p>
        <p>Amount: ₱<span id="amount"></span></p>
        <a href="StorePage.html">Return to Store</a>
    </main>

    <script src="https://checkout.paymongo.com/v1/paymongo.js"></script>
    <script src="js/checkout.js"></script>
    <script>
        // Fetch order details from local storage or other means
        document.addEventListener('DOMContentLoaded', function () {
            const orderId = localStorage.getItem('orderId');
            const amount = localStorage.getItem('amount');
            
            if (orderId && amount) {
                document.getElementById('order-id').textContent = orderId;
                document.getElementById('amount').textContent = amount;
            }
        });
    </script>
</body>
</html>
