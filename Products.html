<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - SecuShare</title>
    <link rel="stylesheet" href="./css/StorePageCSS.css">
    <link rel="stylesheet" href="./css/profile.css">
    <link rel="stylesheet" href="./css/products.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <header>
        <a href="StorePage.html" class="logo"><img src="Img/Logo_Summer.png" alt="SecuShare Logo"></a>
        <nav>
            <ul>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="editProfile.html">Edit Profile</a></li>
                <li><a href="StorePage.html">Store</a></li>
                <li><a href="Products.html">Products</a></li>
                <li><button id="logoutBtn" class="auth-btn">Logout</button></li>
            </ul>
        </nav>
    </header>
    <section class="product-section">
        <div class="container">
            <h1>Products</h1>
            <div class="product-actions">
                <a href="addProduct.html" class="down"><i class='bx bx-plus-circle'></i></a>
            </div>
            <table class="product-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Sales</th>
                        <th>Revenue</th>
                        <th>Price</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Bananut LOGO</td>
                        <td>0</td>
                        <td>$0</td>
                        <td>$0+</td>
                        <td>Unpublished</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td>Totals</td>
                        <td>0</td>
                        <td>$0</td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </section>
    <script src="js/auth.js"></script>
</body>
</html>
