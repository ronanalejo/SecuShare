<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC - SecuShare</title>
    <link rel="stylesheet" href="css/image.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/9.0.0/swiper-bundle.min.css" />
</head>
<body>
    <header>
        <a href="StorePage.html" class="logo"><img src="Img/Logo_Summer.png" alt="SecuShare Logo"></a>
        <ul class="navmenu" id="mainNav">
            <!-- Navigation menu as in your original code -->
        </ul>
        <div class="navicon">
            <input type="text" id="searchBar" placeholder="Search products...">
            <a href="#"><i class='bx bx-cart-alt'></i></a>
            <a href="profile.html"><i class='bx bxs-user-circle'></i></a>
            <div class="bx bx-menu" id="menu-icon"></div>
        </div>
    </header>
    
    <div id="searchSuggestions" class="search-suggestions"></div>
    
    <section class="category-banner">
        <div class="banner-text">
            <h1>Images Category</h1>    
            <p>Explore our collection of Images digital products.</p>
        </div>
    </section>
    
    <section class="subcategories">
        <div class="subcategory">
            <h3>Photos</h3>
            <a href="#photos" class="subcategory-link">View Products</a>
        </div>
        <div class="subcategory">
            <h3>Vectors</h3>
            <a href="#vectors" class="subcategory-link">View Products</a>
        </div>
        <div class="subcategory">
            <h3>Illustrations</h3>
            <a href="#illustrations" class="subcategory-link">View Products</a>
        </div>
        <div class="subcategory">
            <h3>Background</h3>
            <a href="#background" class="subcategory-link">View Products</a>
        </div>
    </section>
    
    <section class="products">
        <section id="photos" class="product-section">
            <h2>Photos</h2>
            <div class="product-container" id="photosContainer"></div>
            <button class="view-more" data-section="photos">View More</button>
            <button class="view-less hidden" data-section="photos">View Less</button>
        </section>
        <section id="vectors" class="product-section">
            <h2>Vectors</h2>
            <div class="product-container" id="vectorsContainer"></div>
            <button class="view-more" data-section="vectors">View More</button>
            <button class="view-less hidden" data-section="photos">View Less</button>
        </section>
        <section id="illustrations" class="product-section">
            <h2>Illustrations</h2>
            <div class="product-container" id="illustrationsContainer"></div>
            <button class="view-more" data-section="illustrations">View More</button>
            <button class="view-less hidden" data-section="photos">View Less</button>
        </section>
        <section id="background" class="product-section">
            <h2>Background</h2>
            <div class="product-container" id="backgroundContainer"></div>
            <button class="view-more" data-section="background">View More</button>
            <button class="view-less hidden" data-section="photos">View Less</button>
        </section>
    </section>

    <script src="js/dropdown.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/9.0.0/swiper-bundle.min.js"></script>
    <script src="js/swiper-init.js"></script>
    <script src="js/search.js"></script>
    <script src="js/viewMore.js"></script>
    <script type="module" src="./js/firebase.js"></script>
    <script type="module" src="./js/firestore.js"></script>
    <script type="module" src="./js/auth.js"></script>
    <script type="module" src="./js/displayProducts.js"></script>
</body>
</html>
