<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SecuShare</title>
    <link rel="stylesheet" href="./css/StorePageCSS.css">
    <link rel="stylesheet" href="./css/register.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <header>
        <a href="login.html" class="logo"><img src="Img/Logo_Summer.png" alt="SecuShare Logo"></a>
    </header>
    <section class="auth-section">
        <div class="auth-container">
            <h2>Register for SecuShare</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="auth-btn">Register</button>
                <p>Already have an account? <a href="login.html"><br>Login here</a></p>
            </form>
        </div>
    </section>
    <script type="module" src="./js/firebase.js"></script>
    <script type="module" src="./js/firestore.js"></script>
    <script type="module" src="./js/auth.js"></script>
</body>
</html>
