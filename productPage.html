<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product - SecuShare</title>
    <link rel="stylesheet" href="StorePageCSS.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <header>
        <a href="index.html" class="logo"><img src="Img/Logo_Summer.png" alt="SecuShare Logo"></a>
        <ul class="navmenu">
            <li><a href="StorePage.html">Store</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </header>
    <section class="product-section">
        <div class="product-container">
            <div class="product-image">
                <img id="productImg" src="" alt="Product Image">
            </div>
            <div class="product-details">
                <h2 id="productName">Product Name</h2>
                <p id="productDescription">Product Description</p>
                <p><strong>Price:</strong> $<span id="productPrice"></span></p>
                <button class="auth-btn" id="buyNowBtn">Buy Now</button>
            </div>
        </div>
    </section>
    <script src="./js/firebase.js" type="module"></script>
    <script src="./js/firestore.js" type="module"></script>
    <script src="./js/auth.js" type="module"></script>
    <script src="./js/product.js"></script>
    <script src="./js/profile.js" type="module" ></script>
</body>
</html>
