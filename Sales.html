<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales - SecuShare</title>
    <link rel="stylesheet" href="./css/StorePageCSS.css">
    <link rel="stylesheet" href="./css/sales.css">
    <link rel="stylesheet" href="./css/profile2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <header>
        <a href="StorePage.html" class="logo"><img src="Img/Logo_Summer.png" alt="SecuShare Logo"></a>
        <ul class="navmenu" id="mainNav">
        </ul>
        <div class="navicon">
            <a href="Cart.html"><i class='bx bx-cart-alt'></i></a>
            <a href="profile.html"><i class='bx bxs-user-circle'></i></a>
            <div class="bx bx-menu" id="menu-icon"></div>
        </div>
    </header>
    <section class="sales-section">
        <div class="sidebar">
            <ul>
                <li><a href="profile.html" class="active"><i class='bx bx-home-alt'></i> Home</a></li>
                <li><a href="purchased.html"><i class='bx bx-purchase-tag'></i> Purchased Items</a></li>
                <li><a href="Products.html"><i class='bx bx-book-open'></i> Products</a></li>
                <li><a href="Sales.html"><i class='bx bx-dollar-circle'></i> Sales</a></li>
                <li><a href="editProfile.html"><i class='bx bx-pencil'></i> Edit Profile</a></li>
                <li><a href="#" id="logoutButton"><i class='bx bx-log-out'></i> Logout</a></li>
            </ul>
        </div>
        </div>

        <main class="main-content">
            <div class="sales-container">
                <h2>Payment Transactions</h2>
                <table id="salesTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Invoice#</th>
                            <th>Source#</th>
                            <th>Payment#</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Created</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
                <div class="total-sales">
                    <p>Total Sales: $<span id="totalSales">0.00</span></p>
                </div>
            </div>
        </main>
    </section>

    <script type="module" src="./js/firebase.js"></script>
    <script type="module" src="./js/firestore.js"></script>
    <script type="module" src="./js/auth.js"></script>
    <script type="module" src="./js/sales.js"></script>
</body>
</html>
