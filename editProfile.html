<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - SecuShare</title>
    <link rel="stylesheet" href="./css/StorePageCSS.css">
    <link rel="stylesheet" href="./css/profile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <header>
        <a href="profile.html" class="logo"><img src="Img/Logo_Summer.png" alt="SecuShare Logo"></a>
        <nav>
            <ul>
                <li><a href="profile.html">Profile</a></li> <!-- Correct link to profile -->
                <li><a href="StorePage.html">Store</a></li>
                <li><button id="logoutBtn" class="auth-btn">Logout</button></li>
            </ul>
        </nav>
    </header>
    <section class="edit-profile-section">
        <div class="edit-profile-container">
            <h2>Edit Profile</h2>
            <form id="editProfileForm">
                <div class="form-group">
                    <label for="profilePicture">Profile Picture</label>
                    <div class="profile-picture-upload">
                        <img alt="Profile Picture" id="currentProfilePicture">
                        <input type="file" id="profilePicture" name="profilePicture" accept="image/png, image/jpeg">
                    </div>
                </div>
                <div class="form-group">
                    <label for="profileName">Name</label>
                    <input type="text" id="profileName" name="profileName" required>
                </div>
                <div class="form-group">
                    <label for="profileEmail">Email</label>
                    <input type="email" id="profileEmail" name="profileEmail" required>
                </div>
                <div class="form-group">
                    <button type="submit" class="save-btn">Save Changes</button>
                </div>
            </form>
        </div>
    </section>
    <script type="module" src="./js/firebase.js"></script>
    <script type="module" src="./js/firestore.js"></script>
    <script type="module" src="./js/auth.js"></script>
    <script type="module" src="./js/editProfile.js"></script>
</body>
</html>
